<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Страница не найдена — ЧЕСТНАЯ ФАБРИКА</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/fonts/fonts.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F2EC; color: #1F1916; font-family: Inter, system-ui, sans-serif;
           min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .box { padding: 48px 24px; max-width: 520px; }
    .code { font-family: Unbounded, Inter, sans-serif; font-size: 72px; color: #5F4438; line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 22px; margin-bottom: 12px; }
    p { font-size: 15px; line-height: 1.6; color: #6B5D52; margin-bottom: 28px; }
    a.btn { display: inline-block; background: #5F4438; color: #F5F2EC; text-decoration: none;
            padding: 14px 32px; border-radius: 12px; font-size: 15px; }
    a.btn:hover { background: #4A342B; }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. Всё про мягкую мебель на заказ — на главной странице.</p>
    <a class="btn" href="/">На главную</a>
  </div>
</body>
</html>
